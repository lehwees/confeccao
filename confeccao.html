<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha do Ateliê</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --denim:#2E4057;
    --denim-dark:#1E2B39;
    --cream:#F3ECDC;
    --paper:#FBF7EC;
    --thread:#B33A3A;
    --thread-dark:#7C2727;
    --tape:#D4A017;
    --ink:#2B2B28;
    --ink-soft:#6B655A;
    --line:#DCD2B8;
    --ok:#4C7A52;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1080px;margin:0 auto;padding:28px 20px 60px;}

  header.top{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;flex-wrap:wrap;
    border-bottom:2px solid var(--denim);
    padding-bottom:14px;margin-bottom:22px;
  }
  header.top h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:30px;
    margin:0;
    color:var(--denim-dark);
    letter-spacing:.2px;
  }
  header.top .sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

  .weeknav{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:var(--denim-dark);
    color:var(--paper);
    padding:10px 14px;
    border-radius:var(--radius);
    margin-bottom:20px;
  }
  .week-controls{display:flex;align-items:center;gap:8px;}
  .weeknav .range{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
  }
  .navbtn{
    background:transparent;
    border:1px solid rgba(255,255,255,.35);
    color:var(--paper);
    width:30px;height:30px;
    border-radius:50%;
    cursor:pointer;
    font-size:16px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;
    padding:0;
  }
  .navbtn:hover{background:rgba(255,255,255,.15);}
  .linkbtn{
    background:transparent;border:none;color:var(--tape);
    font-family:'Work Sans',sans-serif;font-size:12px;font-weight:600;
    text-transform:uppercase;letter-spacing:.5px;cursor:pointer;padding:4px 2px;
  }
  .linkbtn:hover{text-decoration:underline;}
  .weeknav button.primary{
    background:var(--thread);
    border:1px solid var(--thread);
    color:var(--paper);
    padding:8px 16px;
    border-radius:6px;
    cursor:pointer;
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:13px;
  }
  .weeknav button.primary:hover{background:var(--thread-dark);}

  .syncbadge{
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    padding:5px 10px;border-radius:20px;
    background:var(--paper);color:var(--denim-dark);
    border:1px solid var(--line);
    white-space:nowrap;
  }
  .logoutbtn{cursor:pointer;}
  .logoutbtn:hover{background:var(--denim);color:#fff;border-color:var(--denim);}

  @media (max-width:640px){
    .weeknav{flex-direction:column;align-items:stretch;}
    .week-controls{justify-content:center;}
    .print-menu-wrap{align-self:stretch;}
    .print-menu-wrap button.primary{width:100%;}
    .print-menu{left:0;right:0;}
  }

  #loginScreen{
    display:none;
    min-height:100vh;align-items:center;justify-content:center;
    background:var(--denim-dark);
  }
  .login-card{
    background:var(--paper);border-radius:var(--radius);padding:30px 28px;
    width:100%;max-width:340px;box-shadow:0 6px 24px rgba(0,0,0,.25);
  }
  .login-card h1{
    font-family:'Fraunces',serif;font-size:24px;color:var(--denim-dark);margin:0 0 4px;
  }
  .login-card .sub{font-size:12px;color:var(--ink-soft);margin-bottom:18px;font-family:'IBM Plex Mono',monospace;}
  .login-card .loginbtn{
    width:100%;margin-top:16px;padding:11px;border:none;border-radius:8px;
    background:var(--denim);color:#fff;font-weight:600;font-size:14px;
    cursor:pointer;font-family:'Work Sans',sans-serif;
  }
  .login-card .loginbtn:hover{background:var(--denim-dark);}
  #loginError{color:var(--thread);font-size:12px;margin-top:10px;min-height:14px;}

  .person-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .person-chip{
    display:flex;align-items:center;gap:8px;
    background:var(--paper);border:1px solid var(--line);border-radius:20px;
    padding:6px 14px 6px 6px;font-size:13px;font-weight:600;color:var(--denim-dark);
    cursor:pointer;font-family:'Work Sans',sans-serif;
  }
  .person-chip:hover{border-color:var(--denim);}
  .person-chip.active{background:var(--tape);border-color:var(--tape);color:#402d00;}
  .avatar{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
    color:#fff;flex-shrink:0;
  }
  .person-panel{
    background:var(--paper);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;
  }
  .person-panel h3{font-family:'Fraunces',serif;font-size:18px;margin:0 0 14px;color:var(--denim-dark);}
  .person-panel h3 .pend-inline{color:var(--thread);font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;}
  .person-panel .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
  .person-panel .stat{
    text-align:center;font-size:12px;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:8px;padding:10px 8px;
    text-transform:uppercase;letter-spacing:.4px;
  }
  .person-panel .stat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--ink);letter-spacing:0;margin-top:4px;}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .status-dot.pend{background:var(--thread);}
  .status-dot.ok{background:var(--ok);}
  .section-toggle{
    background:none;border:none;color:var(--denim);font-weight:600;font-size:13px;
    cursor:pointer;font-family:'Work Sans',sans-serif;padding:8px 0;text-decoration:underline;
  }

  .layout{display:grid;grid-template-columns:300px 1fr;gap:22px;}
  @media (max-width:760px){.layout{grid-template-columns:1fr;}}

  /* ticket-style form */
  .ticket{
    background:var(--paper);
    border-radius:var(--radius);
    padding:20px 18px 18px;
    position:relative;
    box-shadow:0 1px 0 var(--line);
    height:max-content;
  }
  .ticket::before{
    content:"";
    position:absolute;top:0;left:18px;right:18px;height:0;
    border-top:2px dashed var(--line);
  }
  .ticket h2{
    font-family:'Fraunces', serif;
    font-size:18px;
    margin:10px 0 14px;
    color:var(--denim-dark);
  }
  .seg{
    display:flex;border:1px solid var(--denim);border-radius:8px;overflow:hidden;margin-bottom:14px;
  }
  .seg button{
    flex:1;padding:9px 6px;border:none;background:var(--paper);
    font-family:'Work Sans',sans-serif;font-weight:600;font-size:13px;
    cursor:pointer;color:var(--denim-dark);
  }
  .seg button.active.saida{background:var(--tape);color:#402d00;}
  .seg button.active.retorno{background:var(--ok);color:#fff;}

  label{
    display:block;font-size:12px;font-weight:600;color:var(--ink-soft);
    margin:12px 0 5px;text-transform:uppercase;letter-spacing:.4px;
  }
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;}
  .field-row label{margin-top:12px;white-space:nowrap;}
  input, select{
    width:100%;padding:9px 10px;border:1px solid var(--line);
    border-radius:7px;font-family:'Work Sans',sans-serif;font-size:14px;
    background:#fff;color:var(--ink);box-sizing:border-box;height:38px;
  }
  input[type="number"]{-moz-appearance:textfield;}
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input:focus, select:focus, button:focus-visible{
    outline:2px solid var(--denim);outline-offset:1px;
  }
  .addbtn{
    width:100%;margin-top:16px;padding:11px;border:none;border-radius:8px;
    background:var(--denim);color:#fff;font-weight:600;font-size:14px;
    cursor:pointer;font-family:'Work Sans',sans-serif;
  }
  .addbtn:hover{background:var(--denim-dark);}
  .err{color:var(--thread);font-size:12px;margin-top:8px;min-height:14px;}

  /* summary cards (spool style) */
  .summary-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px;
  }
  .spool{
    background:var(--paper);border-radius:var(--radius);padding:14px 16px;
    box-shadow:0 1px 0 var(--line);
  }
  .spool .name{
    font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--denim-dark);
    margin-bottom:8px;
  }
  .spool .stats{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .spool .bar{
    height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:8px;
  }
  .spool .bar-fill{height:100%;background:var(--ok);}
  .spool .pend{
    font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;
  }
  .spool .pend.zero{color:var(--ok);}
  .spool .pend.pos{color:var(--thread);}
  .spool.total{background:var(--denim-dark);color:var(--paper);}
  .spool.total .name{color:var(--paper);}
  .spool.total .stats{color:#C9D2DB;}
  .spool.total .pend{color:var(--tape);}

  .print-menu-wrap{position:relative;}
  .print-menu{
    display:none;
    position:absolute;top:calc(100% + 6px);right:0;z-index:20;
    background:var(--paper);border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    padding:6px;min-width:230px;
  }
  .print-menu.open{display:block;}
  .print-menu button{
    display:block;width:100%;text-align:left;
    background:none;border:none;padding:9px 10px;border-radius:6px;
    font-family:'Work Sans',sans-serif;font-size:13px;font-weight:600;
    color:var(--ink);cursor:pointer;
  }
  .print-menu button:hover{background:var(--cream);}
  .print-menu-row{display:flex;align-items:center;gap:6px;}
  .print-menu-row button{flex:1;}
  .print-menu-row select{
    width:auto;padding:6px 6px;font-size:12px;border-radius:6px;
  }

  .board-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .board-head h2{font-family:'Fraunces',serif;font-size:18px;color:var(--denim-dark);margin:0;}
  .printbtn{
    background:var(--thread);color:#fff;border:none;padding:9px 16px;border-radius:8px;
    font-weight:600;cursor:pointer;font-family:'Work Sans',sans-serif;font-size:13px;
  }
  .printbtn:hover{background:var(--thread-dark);}

  table.entries{width:100%;border-collapse:collapse;background:var(--paper);border-radius:var(--radius);overflow:hidden;}
  table.entries th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--ink-soft);padding:9px 10px;border-bottom:1px solid var(--line);
  }
  table.entries td{padding:9px 10px;font-size:13px;border-bottom:1px solid var(--line);}
  table.entries tr:last-child td{border-bottom:none;}
  .badge{
    display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;
  }
  .badge.saida{background:#F7E5B0;color:#5A4300;}
  .badge.retorno{background:#D9EADA;color:#245029;}
  .delbtn{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;line-height:1;
  }
  .delbtn:hover{color:var(--thread);}
  .empty{padding:24px;text-align:center;color:var(--ink-soft);font-size:13px;background:var(--paper);border-radius:var(--radius);}

  #printReport{display:none;}
  #printReceipt{display:none;}
  #printReceipt pre{
    font-family:'IBM Plex Mono',monospace;
    white-space:pre;
    margin:0;
    color:#000;
  }
  @media print{
    body:not(.print-receipt) > *:not(#printReport){display:none !important;}
    body:not(.print-receipt) #printReport{display:block !important;}
    #printReport h1{font-family:'Fraunces',serif;font-size:22px;margin-bottom:2px;}
    #printReport .sub{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#444;margin-bottom:18px;}
    #printReport table{width:100%;border-collapse:collapse;margin-bottom:22px;}
    #printReport th, #printReport td{border:1px solid #999;padding:6px 8px;font-size:12px;text-align:left;}
    #printReport th{background:#eee;}
    #printReport h2{font-family:'Fraunces',serif;font-size:15px;margin:0 0 8px;}
    #printReport tfoot td{font-weight:700;background:#f3f3f3;}

    body.print-receipt > *:not(#printReceipt){display:none !important;}
    body.print-receipt #printReceipt{display:block !important;}
    body.print-receipt #printReceipt pre{font-size:12px;line-height:1.35;}
  }
</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-card">
    <h1>Ficha do ateliê</h1>
    <div class="sub">Faça login para continuar</div>
    <form id="loginForm">
      <label for="loginEmail">E-mail</label>
      <input id="loginEmail" type="email" required autocomplete="username">
      <label for="loginPassword">Senha</label>
      <input id="loginPassword" type="password" required autocomplete="current-password">
      <button type="submit" class="loginbtn">Entrar</button>
      <div id="loginError"></div>
    </form>
  </div>
</div>

<div class="app" id="appMain" style="display:none;">
  <header class="top">
    <div>
      <h1>Ficha do ateliê</h1>
      <div class="sub">Gestão de produção e pedidos</div>
    </div>
    <div class="header-right">
      <span id="syncStatus" class="syncbadge">verificando…</span>
      <button id="logoutBtn" class="syncbadge logoutbtn" style="display:none;">Sair</button>
    </div>
  </header>

  <div class="weeknav">
    <div class="week-controls">
      <button id="prevWeek" class="navbtn" title="Semana anterior">‹</button>
      <div class="range" id="weekRange">carregando…</div>
      <button id="nextWeek" class="navbtn" title="Próxima semana">›</button>
      <button id="thisWeek" class="linkbtn">hoje</button>
    </div>
    <div class="print-menu-wrap">
      <button class="primary" id="printMenuBtn">Imprimir ▾</button>
      <div class="print-menu" id="printMenu">
        <button type="button" data-action="relatorio">Relatório da semana</button>
        <button type="button" data-action="totais">Totais gerais por costureiro</button>
        <div class="print-menu-row">
          <button type="button" data-action="cupom">Cupom (maquininha)</button>
          <select id="paperWidth" title="Largura do papel">
            <option value="32">58mm</option>
            <option value="48" selected>80mm</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="layout">
    <div class="ticket">
      <h2>Registrar movimento</h2>
      <div class="seg">
        <button type="button" class="seg-btn saida active" data-tipo="saida">Saída</button>
        <button type="button" class="seg-btn retorno" data-tipo="retorno">Entrada</button>
      </div>

      <label for="nome">Costureiro(a)</label>
      <input id="nome" list="nomesList" placeholder="Nome" autocomplete="off">
      <datalist id="nomesList"></datalist>

      <label for="pedido">Pedido</label>
      <input id="pedido" placeholder="Ex: vestido floral, calça jeans">

      <div class="field-row">
        <div>
          <label for="tamanho">Tamanho</label>
          <input id="tamanho" placeholder="Ex: P, M, G, 40">
        </div>
        <div>
          <label for="cor">Cor</label>
          <input id="cor" placeholder="Ex: azul">
        </div>
      </div>

      <label for="qtd">Quantidade</label>
      <input id="qtd" type="number" min="1" step="1" placeholder="0">

      <div id="valorField">
        <label for="valorUnit">Valor (R$)</label>
        <input id="valorUnit" type="number" min="0" step="0.01" placeholder="0,00">
      </div>

      <label for="data">Data</label>
      <input id="data" type="date">

      <button class="addbtn" id="addBtn">Adicionar</button>
      <div class="err" id="errMsg"></div>
    </div>

    <div class="board">
      <div class="board-head"><h2>Costureiros</h2></div>
      <div class="person-list" id="personList"></div>
      <div id="personDetail"></div>
    </div>
  </div>
</div>

<div id="printReport"></div>
<div id="printReceipt"><pre id="receiptText"></pre></div>

<script>
const state = {
  movimentos: [],
  tipoAtual: 'saida',
  weekRef: new Date(),
  selectedCostureiro: null
};

/* ======================================================================
   CONFIGURAÇÃO DA NUVEM (Firebase)
   Para sincronizar entre computador e celular, crie um projeto gratuito
   em https://console.firebase.google.com, ative o Firestore Database e
   cole aqui os dados de configuração do seu app web (Configurações do
   projeto > Seus apps > SDK). Enquanto isso não for preenchido, o
   sistema salva apenas neste aparelho (localStorage).
   ====================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCdMKCOmZTOSqxEtVhjsWCNJ9TmuPbXLxE",
  authDomain: "confeccao-7fc5e.firebaseapp.com",
  projectId: "confeccao-7fc5e",
  storageBucket: "confeccao-7fc5e.firebasestorage.app",
  messagingSenderId: "751617195260",
  appId: "1:751617195260:web:58119bf625431f09222b79"
};

let useCloud = false;
let docRef = null;
let auth = null;

function setSyncStatus(status){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  const map = {
    local: 'Salvando só neste aparelho',
    conectando: 'Conectando à nuvem…',
    online: 'Sincronizado ✓',
    erro: 'Erro de conexão — salvando local'
  };
  el.textContent = map[status] || status;
}

function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appMain').style.display = 'block';
  document.getElementById('logoutBtn').style.display = useCloud ? 'inline-block' : 'none';
}
function showLogin(){
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appMain').style.display = 'none';
}

function attachFirestoreListener(){
  docRef.onSnapshot(snap=>{
    state.movimentos = (snap.exists && snap.data().movimentos) ? snap.data().movimentos : [];
    setSyncStatus('online');
    render();
  }, err=>{
    console.error('Erro Firestore', err);
    setSyncStatus('erro');
  });
}

function initCloud(){
  if(!firebaseConfig.apiKey || firebaseConfig.apiKey === 'SUA_API_KEY_AQUI'){
    useCloud = false;
    setSyncStatus('local');
    showApp();
    loadLocal();
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    const db = firebase.firestore();
    docRef = db.collection('atelie').doc('dados');
    useCloud = true;

    auth.onAuthStateChanged(user=>{
      if(user){
        showApp();
        setSyncStatus('conectando');
        attachFirestoreListener();
      } else {
        showLogin();
      }
    });
  }catch(e){
    console.error('Erro ao iniciar Firebase', e);
    useCloud = false;
    setSyncStatus('local');
    showApp();
    loadLocal();
  }
}

function loadLocal(){
  try{
    const raw = localStorage.getItem('ficha_atelie_movimentos');
    state.movimentos = raw ? JSON.parse(raw) : [];
  }catch(e){
    state.movimentos = [];
  }
  render();
}

async function saveData(){
  if(useCloud && docRef){
    try{
      await docRef.set({movimentos: state.movimentos}, {merge:true});
      return;
    }catch(e){
      console.error('Falha ao salvar na nuvem, salvando local', e);
    }
  }
  try{
    localStorage.setItem('ficha_atelie_movimentos', JSON.stringify(state.movimentos));
  }catch(e){
    console.error('Falha ao salvar', e);
  }
}

function loadData(){
  initCloud();
}

function toISODate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseISO(s){ return new Date(s+'T12:00:00'); }
function formatBR(d){
  const day=String(d.getDate()).padStart(2,'0'), m=String(d.getMonth()+1).padStart(2,'0'), y=d.getFullYear();
  return `${day}/${m}/${y}`;
}
function formatMoney(v){
  return 'R$ ' + (v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function movValorDisplay(m){
  return m.tipo==='saida' ? '–' : formatMoney((m.valorUnit||0)*m.qtd);
}
function formatSaldo(pend){
  if(pend>0) return '-'+pend;
  if(pend<0) return '+'+Math.abs(pend);
  return '0';
}
function getWeekRange(ref){
  const d = new Date(ref); d.setHours(12,0,0,0);
  const dow = d.getDay();
  const diff = dow===0 ? -6 : 1-dow;
  const start = new Date(d); start.setDate(d.getDate()+diff); start.setHours(0,0,0,0);
  const end = new Date(start); end.setDate(start.getDate()+6); end.setHours(23,59,59,999);
  return {start,end};
}

function weekMovs(){
  const {start,end} = getWeekRange(state.weekRef);
  return state.movimentos.filter(m=>{
    const d = parseISO(m.data);
    return d>=start && d<=end;
  });
}

}

function productTotals(movs){
  const byProd = {};
  movs.forEach(m=>{
    const tam = (m.tamanho||'').trim();
    const cor = (m.cor||'').trim();
    const key = [m.pedido.trim().toLowerCase(), tam.toLowerCase(), cor.toLowerCase()].join('|');
    if(!byProd[key]){
      const labelParts = [m.pedido.trim()];
      if(tam) labelParts.push(tam);
      if(cor) labelParts.push(cor);
      byProd[key] = {label:labelParts.join(' — '), levou:0, trouxe:0, valorPagar:0};
    }
    if(m.tipo==='saida'){
      byProd[key].levou += m.qtd;
    } else {
      byProd[key].trouxe += m.qtd;
      byProd[key].valorPagar += (m.valorUnit||0)*m.qtd;
    }
  });
  return Object.values(byProd).sort((a,b)=>a.label.localeCompare(b.label));
}

const AVATAR_COLORS = ['#B33A3A','#2E4057','#D4A017','#4C7A52','#7C5A9B','#C06C2E'];
function avatarColor(name){
  let hash=0;
  for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}
function initials(name){
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase();
}

function center(text, width){
  text = String(text);
  if(text.length>=width) return text.slice(0,width);
  const pad = width-text.length;
  const left = Math.floor(pad/2);
  return ' '.repeat(left)+text+' '.repeat(pad-left);
}
function truncate(text, width){
  text = String(text);
  return text.length>width ? text.slice(0,width-1)+'.' : text;
}
function padBetween(left, right, width){
  left = String(left); right = String(right);
  const gap = Math.max(1, width-left.length-right.length);
  return left + ' '.repeat(gap) + right;
}

function buildReceiptText(width){
  const {start,end} = getWeekRange(state.weekRef);
  const movs = weekMovs();
  const byName = {};
  let totalLevou=0, totalTrouxe=0, totalValor=0;
  movs.forEach(m=>{
    if(!byName[m.nome]) byName[m.nome] = {levou:0, trouxe:0, valorPagar:0};
    if(m.tipo==='saida'){ byName[m.nome].levou += m.qtd; totalLevou += m.qtd; }
    else { byName[m.nome].trouxe += m.qtd; totalTrouxe += m.qtd; byName[m.nome].valorPagar += (m.valorUnit||0)*m.qtd; totalValor += (m.valorUnit||0)*m.qtd; }
  });
  const line = '-'.repeat(width);
  const out = [];
  out.push(center('ATELIE', width));
  out.push(center('RELATORIO SEMANAL', width));
  out.push(line);
  out.push('De: '+formatBR(start));
  out.push('Ate: '+formatBR(end));
  out.push(line);

  const names = Object.keys(byName).sort();
  if(names.length===0){
    out.push('Sem movimentos nesta');
    out.push('semana.');
  } else {
    names.forEach(n=>{
      const s = byName[n];
      const pend = s.levou - s.trouxe;
      out.push(truncate(n.toUpperCase(), width));
      out.push(padBetween('Saida', s.levou, width));
      out.push(padBetween('Entrada', s.trouxe, width));
      out.push(padBetween('Pendente', pend, width));
      out.push(padBetween('Valor a pagar', formatMoney(s.valorPagar), width));
      out.push(line);
    });
  }

  out.push(padBetween('TOTAL SAIDA', totalLevou, width));
  out.push(padBetween('TOTAL ENTRADA', totalTrouxe, width));
  out.push(padBetween('PENDENTE GERAL', totalLevou-totalTrouxe, width));
  out.push(padBetween('VALOR A PAGAR', formatMoney(totalValor), width));
  out.push(line);

  const prods = productTotals(movs);
  if(prods.length>0){
    out.push(center('POR PRODUTO', width));
    out.push(line);
    prods.forEach(p=>{
      out.push(truncate(p.label.toUpperCase(), width));
      out.push(padBetween('Saida', p.levou, width));
      out.push(padBetween('Entrada', p.trouxe, width));
      out.push(padBetween('Pendente', p.levou-p.trouxe, width));
      out.push(padBetween('Valor', formatMoney(p.valorPagar), width));
      out.push(line);
    });
  }
  out.push(center('Impresso em', width));
  out.push(center(formatBR(new Date()), width));
  out.push('');
  out.push('');
  return out.join('\n');
}

function setReceiptPageStyle(on, width){
  let el = document.getElementById('receiptPageStyle');
  if(on){
    if(!el){
      el = document.createElement('style');
      el.id = 'receiptPageStyle';
      document.head.appendChild(el);
    }
    const mm = width==='32' ? '58mm' : '80mm';
    el.textContent = `@page{size:${mm} auto;margin:2mm;}`;
  } else if(el){
    el.remove();
  }
}

function buildPrintReport(){
  const {start,end} = getWeekRange(state.weekRef);
  const movs = weekMovs().slice().sort((a,b)=> a.nome.localeCompare(b.nome) || a.data.localeCompare(b.data));
  const byName = {};
  let totalLevou=0, totalTrouxe=0, totalValor=0;
  movs.forEach(m=>{
    if(!byName[m.nome]) byName[m.nome] = {levou:0, trouxe:0, valorPagar:0};
    if(m.tipo==='saida'){ byName[m.nome].levou += m.qtd; totalLevou += m.qtd; }
    else { byName[m.nome].trouxe += m.qtd; totalTrouxe += m.qtd; byName[m.nome].valorPagar += (m.valorUnit||0)*m.qtd; totalValor += (m.valorUnit||0)*m.qtd; }
  });

  let detailRows = movs.map(m=>`<tr>
    <td>${formatBR(parseISO(m.data))}</td>
    <td>${escapeHtml(m.nome)}</td>
    <td>${escapeHtml(m.pedido)}</td>
    <td>${escapeHtml(m.tamanho||'-')}</td>
    <td>${escapeHtml(m.cor||'-')}</td>
    <td>${m.qtd}</td>
    <td>${movValorDisplay(m)}</td>
    <td>${m.tipo==='saida'?'Saída':'Entrada'}</td>
  </tr>`).join('') || `<tr><td colspan="8">Sem movimentos registrados.</td></tr>`;

  let summaryRows = Object.keys(byName).sort().map(n=>{
    const s = byName[n];
    const pend = s.levou - s.trouxe;
    return `<tr><td>${escapeHtml(n)}</td><td>${s.levou}</td><td>${s.trouxe}</td><td>${pend}</td><td>${formatMoney(s.valorPagar)}</td></tr>`;
  }).join('') || `<tr><td colspan="5">Sem dados.</td></tr>`;

  const prods = productTotals(movs);
  let prodTotalLevou=0, prodTotalTrouxe=0, prodTotalValor=0;
  let productRows = prods.map(p=>{
    prodTotalLevou += p.levou; prodTotalTrouxe += p.trouxe; prodTotalValor += p.valorPagar;
    return `<tr><td>${escapeHtml(p.label)}</td><td>${p.levou}</td><td>${p.trouxe}</td><td>${p.levou-p.trouxe}</td><td>${formatMoney(p.valorPagar)}</td></tr>`;
  }).join('') || `<tr><td colspan="5">Sem dados.</td></tr>`;

  document.getElementById('printReport').innerHTML = `
    <h1>Relatório semanal — Ateliê</h1>
    <div class="sub">Semana de ${formatBR(start)} a ${formatBR(end)} — impresso em ${formatBR(new Date())}</div>

    <h2>Resumo por costureiro</h2>
    <table>
      <thead><tr><th>Costureiro</th><th>Saída</th><th>Entrada</th><th>Pendente</th><th>Valor a pagar</th></tr></thead>
      <tbody>${summaryRows}</tbody>
      <tfoot><tr><td>Total geral</td><td>${totalLevou}</td><td>${totalTrouxe}</td><td>${totalLevou-totalTrouxe}</td><td>${formatMoney(totalValor)}</td></tr></tfoot>
    </table>

    <h2>Total por produto</h2>
    <table>
      <thead><tr><th>Produto</th><th>Saída</th><th>Entrada</th><th>Pendente</th><th>Valor a pagar</th></tr></thead>
      <tbody>${productRows}</tbody>
      <tfoot><tr><td>Total geral</td><td>${prodTotalLevou}</td><td>${prodTotalTrouxe}</td><td>${prodTotalLevou-prodTotalTrouxe}</td><td>${formatMoney(prodTotalValor)}</td></tr></tfoot>
    </table>

    <h2>Detalhamento dos movimentos</h2>
    <table>
      <thead><tr><th>Data</th><th>Costureiro</th><th>Pedido</th><th>Tam.</th><th>Cor</th><th>Qtd</th><th>Valor</th><th>Tipo</th></tr></thead>
      <tbody>${detailRows}</tbody>
    </table>
  `;
}

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try{
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(err){
    errEl.textContent = 'E-mail ou senha incorretos.';
  }
});

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  if(auth) auth.signOut();
});

document.getElementById('data').value = toISODate(new Date());
loadData();
